version: '3'
services:  
  featureform:
    build: .
    ports:
      - "8080:8080"
    environment:      
      - FEATUREFORM_CONFIG=config.yml   
    volumes:      
      - ./config.yml:/app/config.yml
      - /var/run/docker.sock:/var/run/docker.sock  # Add this line    
    networks:      
      - featureform-network
networks:
  featureform-network:   
    driver: bridge